name: Apple Refurb Stock Check

# 5分ごとに実行（GitHub Actions の cron 最短間隔）。
# 注意: スケジュール実行は混雑時に数分〜数十分遅延することがある。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行も可能

# state.json をコミットで書き戻すために書き込み権限を付与
permissions:
  contents: write

# 多重起動を防ぐ（前回実行が残っていたら待つ）
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Secret（CONFIG_JSON）から config/config.json を生成する。
      # config.json は機密を含むためリポジトリにはコミットせず、
      # GitHub の暗号化 Secret に中身を丸ごと保管しておく方式。
      - name: Generate config.json from secret
        run: |
          mkdir -p config
          printf '%s' "$CONFIG_JSON" > config/config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Run stock check
        run: |
          cd script
          python notifier.py

      # 「前回の在庫状態」を次回実行に引き継ぐため、
      # state.json に変化があればコミットして書き戻す。
      # [skip ci] を付けているので、このコミットで再実行はされない。
      - name: Commit state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update stock state [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          else
            echo "No state change."
          fi